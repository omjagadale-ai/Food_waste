<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a FoodShare account — start donating surplus food or volunteering today." />
  <title>Register — FoodShare</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Navbar ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">🍲</div>
      Food<span>Share</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html" class="active btn btn-primary btn-sm">Get Started</a></li>
    </ul>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
  </nav>

  <!-- ── Register Form ──────────────────────────────────────── -->
  <main class="auth-page">
    <div class="auth-card slide-up" style="max-width:500px;">
      <h1>Create Account</h1>
      <p class="sub">Join FoodShare and make a difference</p>

      <div id="regError" style="display:none; color:var(--color-danger); margin-bottom:var(--sp-md); font-size:0.9rem;">
      </div>

      <!-- Role Selector -->
      <div class="role-selector" id="roleSelector">
        <div class="role-option selected" data-role="donor" id="roleDonor">
          <div class="role-icon">🏪</div>
          <div class="role-title">Donor</div>
          <div class="role-desc">Restaurant, household, or event</div>
        </div>
        <div class="role-option" data-role="volunteer" id="roleVolunteer">
          <div class="role-icon">🤝</div>
          <div class="role-title">Volunteer</div>
          <div class="role-desc">NGO or individual helper</div>
        </div>
      </div>

      <form id="registerForm" autocomplete="on">
        <input type="hidden" id="role" value="donor" />

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Jane Doe" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" minlength="6"
            required />
        </div>

        <div class="form-group">
          <label for="phone">Phone <span class="text-muted">(optional)</span></label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" />
        </div>

        <div class="form-group">
          <label for="address">Address <span class="text-muted">(optional)</span></label>
          <input type="text" id="address" class="form-control" placeholder="123 Main St, City" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="regBtn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Role selector toggle
    const roleOptions = document.querySelectorAll('.role-option');
    const roleInput = document.getElementById('role');
    roleOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        roleOptions.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        roleInput.value = opt.dataset.role;
      });
    });

    // Form submit
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('regError');
      errorEl.style.display = 'none';
      const btn = document.getElementById('regBtn');
      btn.textContent = 'Creating…';
      btn.disabled = true;

      try {
        const res = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: roleInput.value,
            phone: document.getElementById('phone').value || null,
            address: document.getElementById('address').value || null,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        window.location.href = data.user.role === 'donor' ? 'donor_dashboard.html' : 'volunteer_dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
