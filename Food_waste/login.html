<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to FoodShare — manage your food donations or volunteer pickups." />
  <title>Login — FoodShare</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ── Navbar ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">🍲</div>
      Food<span>Share</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html" class="active">Login</a></li>
      <li><a href="register.html" class="btn btn-primary btn-sm">Get Started</a></li>
    </ul>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
  </nav>

  <!-- ── Login Form ─────────────────────────────────────────── -->
  <main class="auth-page">
    <div class="auth-card slide-up">
      <h1>Welcome Back</h1>
      <p class="sub">Sign in to continue to your dashboard</p>

      <div id="loginError"
        style="display:none; color:var(--color-danger); margin-bottom:var(--sp-md); font-size:0.9rem;"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('loginError');
      errorEl.style.display = 'none';
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Redirect based on role
        window.location.href = data.user.role === 'donor' ? 'donor_dashboard.html' : 'volunteer_dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
